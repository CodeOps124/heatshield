  <text class="s" x="546" y="768">→ Kai; heartbeats → Otto</text>
  <text class="s" x="546" y="784">read live by Agent HQ</text>
  <path class="e" d="M482 708 H528"/>
  <path class="e" d="M528 774 H484"/>
