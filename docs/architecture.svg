<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1040" width="1220" height="1040" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HeatShield architecture on AWS</title>
  <desc id="d">Browsers reach CloudFront, which serves the static site and plan audio from a private S3 bucket and forwards /api to an API Gateway HTTP API backed by three Lambda functions. The public Lambda reads Open-Meteo weather, computes the NWS heat index, runs the plan pipeline on Amazon Bedrock (Mira writes, Lexi and Vera review) reads approved plans aloud with Amazon Polly, and answers Ask the team, where Kai (Kimi K2.5) assigns questions to the agents’ read-only tools. The enrollment Lambda stores groups and locations and subscribes emails to SNS. The admin Lambda is reached only with an Amazon Cognito token that API Gateway verifies; it holds the operator controls. Every hour EventBridge Scheduler runs the Dispatcher Lambda, which recomputes risk and emails alerts through SNS. More schedules run the agents Sol (hourly heatwaves and ensemble chances), Kai (3-hourly check-in plans), Otto (15-minute operations watchdog), Quinn (daily forecast audit) and Iris (daily word lists). Agents share state through the DynamoDB AgentLog table. Failed asynchronous runs are retried once, then kept in an SQS dead-letter queue; nine CloudWatch alarms and Otto's incident reports reach the operator through the SNS ops topic.</desc>
