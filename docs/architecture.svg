  <path class="e" d="M972 520 H1010 Q1012 520 1012 300 V300 H1020"/>
  <path class="e" d="M1198 470 H1208 Q1212 470 1212 480 V600 Q1212 610 1200 610 H120 Q114 610 114 600 V592"/>

  <text class="lbl" x="206" y="136">HTTPS</text>
  <text class="lbl" x="1030" y="600">SNS email</text>
  <text class="lbl" x="686" y="498">invoke</text>

  <!-- ================================================================ agents band -->
  <rect class="zone" x="24" y="636" width="1172" height="244" rx="14"/>
  <text class="zt" x="40" y="660">SIX AI AGENTS · an algorithm does the exact part, Amazon Bedrock the judgment, code makes the final call</text>

  <rect class="aws" x="40" y="712" width="180" height="84" rx="10"/>
  <text class="h" x="56" y="740">EventBridge Scheduler</text>
  <text class="s" x="56" y="760">Sol hourly · Kai 3-hourly</text>
  <text class="s" x="56" y="776">Otto every 15 min</text>

  <rect class="agent" x="262" y="680" width="220" height="56" rx="10"/>
  <text class="h" x="278" y="703">Lambda · Sol</text>
  <text class="s" x="278" y="722">Excess Heat Factor vs local climate</text>
  <rect class="agent" x="262" y="746" width="220" height="56" rx="10"/>
  <text class="h" x="278" y="769">Lambda · Kai</text>
  <text class="s" x="278" y="788">urgency score + EDF check-ins</text>
  <rect class="agent" x="262" y="812" width="220" height="56" rx="10"/>
  <text class="h" x="278" y="835">Lambda · Otto</text>
  <text class="s" x="278" y="854">probes · EWMA · heartbeats · logs</text>

