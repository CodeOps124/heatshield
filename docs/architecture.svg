<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 900" width="1220" height="900" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HeatShield architecture on AWS</title>
  <desc id="d">Browsers reach CloudFront, which serves the static site from a private S3 bucket and forwards /api to an API Gateway HTTP API backed by two Lambda functions. The public Lambda reads Open-Meteo weather, computes the NWS heat index, and runs the plan pipeline on Amazon Bedrock: Mira writes, Lexi and Vera review. Approved plans are cached in DynamoDB. The enrollment Lambda stores groups and locations and subscribes emails to SNS. Every hour EventBridge Scheduler runs an alert-check Lambda that recomputes risk and emails alerts through SNS. Three more schedules run the agents Sol (hourly heatwave detection), Kai (3-hourly group check-in plans) and Otto (15-minute operations watchdog); every agent run and the state they share is kept in a DynamoDB AgentLog table, Otto reads CloudWatch Logs and publishes incidents to an SNS ops topic.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#c3c2b7;stroke-width:1.5}
      .aws{fill:#fff7ef;stroke:#eb6834;stroke-width:1.5}
      .agent{fill:#f3fbf6;stroke:#2b7a47;stroke-width:1.5}
      .ext{fill:#f0f6ff;stroke:#2a78d6;stroke-width:1.5;stroke-dasharray:0}
      .h{font-size:15px;font-weight:700;fill:#0b0b0b}
      .s{font-size:12px;fill:#52514e}
      .e{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lbl{font-size:11px;fill:#52514e}
      .zone{fill:none;stroke:#cfe8d8;stroke-width:1.5}
      .zt{font-size:12px;font-weight:700;fill:#2b7a47;letter-spacing:.04em}
    </style>
  </defs>
  <rect width="1220" height="900" rx="18" fill="#fcfcfb"/>

  <!-- legend -->
