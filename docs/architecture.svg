  <rect class="agent" x="24" y="48" width="14" height="14" rx="3"/>
  <text class="s" x="44" y="60">AI agent (algorithm + Amazon Bedrock)</text>
  <rect class="ext" x="24" y="72" width="14" height="14" rx="3"/>
  <text class="s" x="44" y="84">external free API</text>

  <!-- people -->
  <rect class="box" x="24" y="110" width="180" height="70" rx="10"/>
  <text class="h" x="40" y="138">People at risk</text>
  <text class="s" x="40" y="158">workers, older adults,</text>
  <text class="s" x="40" y="173">families · any browser</text>
  <rect class="box" x="24" y="210" width="180" height="70" rx="10"/>
  <text class="h" x="40" y="238">Community leader</text>
  <text class="s" x="40" y="258">private dashboard with</text>
  <text class="s" x="40" y="273">Kai's check-in plan</text>
  <rect class="box" x="24" y="520" width="180" height="70" rx="10"/>
  <text class="h" x="40" y="548">Email inbox</text>
  <text class="s" x="40" y="568">alert in their language,</text>
  <text class="s" x="40" y="583">double opt-in, unsubscribe</text>

  <!-- edge -->
  <rect class="aws" x="252" y="150" width="190" height="96" rx="10"/>
  <text class="h" x="268" y="178">Amazon CloudFront</text>
  <text class="s" x="268" y="198">one HTTPS URL, global edge</text>
  <text class="s" x="268" y="214">CSP + HSTS headers</text>
  <text class="s" x="268" y="230">/api/* → API, rest → S3</text>

  <rect class="aws" x="482" y="60" width="200" height="72" rx="10"/>
  <text class="h" x="498" y="88">Amazon S3</text>
  <text class="s" x="498" y="108">private bucket, OAC only</text>
  <text class="s" x="498" y="123">site + Agent HQ (pixel office)</text>

  <rect class="aws" x="482" y="222" width="200" height="72" rx="10"/>
  <text class="h" x="498" y="250">API Gateway</text>
  <text class="s" x="498" y="270">HTTP API · per-route</text>
  <text class="s" x="498" y="285">throttling · access logs</text>

  <!-- lambdas -->
  <rect class="aws" x="722" y="122" width="250" height="118" rx="10"/>
  <text class="h" x="738" y="148">Lambda · public API</text>
  <text class="s" x="738" y="168">geocode · NWS heat index · risk</text>
  <text class="s" x="738" y="184">plans: Mira writes, Lexi + Vera</text>
  <text class="s" x="738" y="200">review (up to 2 revisions)</text>
  <text class="s" x="738" y="216">/api/agents · run Sol or Otto</text>
  <text class="s" x="738" y="232">on demand (shared cooldowns)</text>

  <rect class="aws" x="722" y="300" width="250" height="84" rx="10"/>
  <text class="h" x="738" y="328">Lambda · enrollment API</text>
  <text class="s" x="738" y="348">groups · registrations · dashboard</text>
  <text class="s" x="738" y="364">· delete my data / the group</text>

  <rect class="aws" x="482" y="470" width="200" height="72" rx="10"/>
  <text class="h" x="498" y="498">EventBridge Scheduler</text>
  <text class="s" x="498" y="518">cron(0 * * * ? *)</text>
  <text class="s" x="498" y="533">every hour</text>

  <rect class="aws" x="722" y="464" width="250" height="84" rx="10"/>
  <text class="h" x="738" y="492">Lambda · Dispatcher</text>
  <text class="s" x="738" y="512">re-score everyone · quiet hours ·</text>
  <text class="s" x="738" y="528">atomic per-day/per-tier dedupe</text>

  <!-- services right -->
  <rect class="ext" x="1022" y="40" width="176" height="70" rx="10"/>
  <text class="h" x="1038" y="68">Open-Meteo</text>
  <text class="s" x="1038" y="88">forecast, geocoding,</text>
  <text class="s" x="1038" y="102">ERA5 climate (no key)</text>

  <rect class="aws" x="1022" y="122" width="176" height="114" rx="10"/>
  <text class="h" x="1038" y="148">Amazon Bedrock</text>
  <text class="s" x="1038" y="168">Converse API + tool use</text>
  <text class="s" x="1038" y="184">Nova 2 Lite: writer, agents</text>
  <text class="s" x="1038" y="200">Nova Pro: reviewers</text>
  <text class="s" x="1038" y="216">Claude Haiku 4.5: primary</text>
  <text class="s" x="1038" y="230">writer once enabled</text>

  <rect class="aws" x="1022" y="246" width="176" height="110" rx="10"/>
  <text class="h" x="1038" y="274">DynamoDB</text>
  <text class="s" x="1038" y="294">Groups · Locations</text>
  <text class="s" x="1038" y="310">(GSI byGroup) · Alerts</text>
  <text class="s" x="1038" y="326">· GuidanceCache (TTL)</text>
  <text class="s" x="1038" y="342">on-demand</text>

  <rect class="aws" x="1022" y="400" width="176" height="84" rx="10"/>
  <text class="h" x="1038" y="428">Amazon SNS</text>
  <text class="s" x="1038" y="448">alerts topic, per-person</text>
  <text class="s" x="1038" y="464">filter policy</text>

