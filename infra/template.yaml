AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  HeatShield - multilingual heat-risk early warning. S3 + CloudFront frontend, HTTP API + Lambda
  backend, DynamoDB, Amazon Bedrock guidance, EventBridge Scheduler + SNS alerts. Fully serverless:
  near-zero idle cost, nothing to patch.

Parameters:
  BedrockModelId:
    Type: String
    Description: Primary Bedrock model or inference-profile ID for guidance generation.
  BedrockFallbackModelId:
    Type: String
    Default: ''
    Description: Optional second model tried when the primary fails (for example an Amazon Nova profile).
  BedrockFoundationModelArnPattern:
    Type: String
    Default: 'anthropic.claude-haiku-4-5*'
    Description: Foundation-model name pattern the primary inference profile routes to (IAM scoping).
  BedrockFallbackFoundationModelArnPattern:
    Type: String
    Default: 'amazon.nova-*'
    Description: Foundation-model name pattern for the fallback model (IAM scoping).
  AgentModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Model for the tool-using agents (Sol, Kai, Otto).
  AgentFoundationModelArnPattern:
    Type: String
    Default: 'amazon.nova-2-lite*'
  ReviewerModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
    Description: Model for the reviewers (Lexi, Vera) - a different model family from the writer.
  ReviewerFoundationModelArnPattern:
    Type: String
    Default: 'amazon.nova-pro*'
  AppVersion:
    Type: String
    Default: dev
  AlertScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: ENABLED

Conditions:
  HasFallbackModel: !Not [!Equals [!Ref BedrockFallbackModelId, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    CodeUri: functions/
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        APP_VERSION: !Ref AppVersion
        GROUPS_TABLE: !Ref GroupsTable
        LOCATIONS_TABLE: !Ref LocationsTable
        ALERTS_TABLE: !Ref AlertsTable
        GUIDANCE_CACHE_TABLE: !Ref GuidanceCacheTable
        ALERTS_TOPIC_ARN: !Ref AlertsTopic
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
        AGENT_MODEL_ID: !Ref AgentModelId
        REVIEWER_MODEL_ID: !Ref ReviewerModelId
        AGENT_LOG_TABLE: !Ref AgentLogTable

Resources:
  # ------------------------------------------------------------------ agents: shared model access
  # One managed policy, scoped to exactly the inference profiles (and the foundation models they
  # route to) that HeatShield uses. Attached to every function that calls Bedrock.
  BedrockInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: HeatShield - invoke only the Bedrock models the agents use
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeHeatShieldModels
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${AgentModelId}
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ReviewerModelId}
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelArnPattern}
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${AgentFoundationModelArnPattern}
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${ReviewerFoundationModelArnPattern}
              - !If
                - HasFallbackModel
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockFallbackModelId}
                - !Ref AWS::NoValue
              - !If
                - HasFallbackModel
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFallbackFoundationModelArnPattern}
                - !Ref AWS::NoValue

  AgentLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: HeatShield Ops # Otto's incident reports; subscribe an on-call email to receive them

  # ------------------------------------------------------------------ data
  GroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: groupId, AttributeType: S }
      KeySchema:
        - { AttributeName: groupId, KeyType: HASH }

  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: locationId, AttributeType: S }
        - { AttributeName: groupId, AttributeType: S }
      KeySchema:
        - { AttributeName: locationId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: byGroup # sparse: only locations enrolled in a group carry groupId
          KeySchema:
            - { AttributeName: groupId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: locationId, AttributeType: S }
        - { AttributeName: alertDate, AttributeType: S }
      KeySchema:
        - { AttributeName: locationId, KeyType: HASH }
        - { AttributeName: alertDate, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  GuidanceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: cacheKey, AttributeType: S }
      KeySchema:
        - { AttributeName: cacheKey, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  # ------------------------------------------------------------------ alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: HeatShield # shown as the sender name on alert emails

  # ------------------------------------------------------------------ API
  HttpApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: # per-route throttle: caps abuse (and Bedrock spend) on a public endpoint
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        # Registrations can trigger an AWS confirmation email to any address typed in, so these
        # routes are throttled hard to stop HeatShield being used to spam inboxes.
        # (Production: add an AWS WAF per-IP rate-based rule on CloudFront.)
        POST /api/locations:
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        POST /api/groups:
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        POST /api/groups/{groupId}/plan: # runs Kai (Bedrock); also a per-group 10-minute cooldown in code
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  PublicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Public API - health, geocoding, heat risk, guidance (Mira writes, Lexi and Vera review), agents feed
      Handler: handlers/public-api.handler
      Timeout: 28
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GuidanceCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
      Events:
        Agents: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/agents } }
        Health: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/health } }
        Geocode: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/geocode } }
        Risk: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/risk } }
        Guidance: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/guidance } }

  EnrollmentApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Groups, registrations, community-leader dashboard (with Kai's check-in plan), self-service deletion
      Handler: handlers/enrollment-api.handler
      Timeout: 28
      Environment:
        Variables:
          COORDINATOR_FUNCTION: !Ref CoordinatorFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GroupsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AgentLogTable }
        - LambdaInvokePolicy: { FunctionName: !Ref CoordinatorFunction }
        - Statement:
            - Sid: SubscribeEmailToAlerts
              Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertsTopic
            - Sid: ManageOwnSubscriptions
              Effect: Allow
              Action: [sns:Unsubscribe, sns:GetSubscriptionAttributes]
              # SNS authorizes these against the TOPIC ARN, not the subscription ARN (verified in
              # CloudTrail: "not authorized to perform: SNS:GetSubscriptionAttributes on resource:
              # arn:aws:sns:...:heatshield-AlertsTopic-..."). Both forms are listed.
              Resource: [!Ref AlertsTopic, !Sub '${AlertsTopic}:*']
      Events:
        CreateGroup: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/groups } }
        GetGroup: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/groups/{groupId}' } }
        Dashboard: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/groups/{groupId}/dashboard' } }
        RemoveMember: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/groups/{groupId}/members/{locationId}' } }
        Register: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/locations } }
        GetLocation: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/locations/{locationId}' } }
        DeleteLocation: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/locations/{locationId}' } }
        RequestPlan: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/groups/{groupId}/plan' } }

  AlertCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Hourly - recompute risk for every registered location and send SNS alerts on threshold crossing
      Handler: handlers/alert-check.handler
      Timeout: 300
      Environment:
        Variables:
          SITE_URL: !Sub https://${Distribution.DomainName}
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GuidanceCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - !Ref BedrockInvokePolicy
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 * * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 } # next hour's run is the retry

  # Explicit log groups so logs expire (cost hygiene) instead of being kept forever.
  PublicApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PublicApiFunction}
      RetentionInDays: 14
  EnrollmentApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EnrollmentApiFunction}
      RetentionInDays: 14
  AlertCheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AlertCheckFunction}
      RetentionInDays: 14

  # ------------------------------------------------------------------ scheduled AI agents
  SentinelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Sol - Heat Sentinel agent. Excess Heat Factor vs local climate, heat watches and briefing
      Handler: handlers/agents.sentinel
      Timeout: 300
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 * * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  CoordinatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Kai - Community Coordinator agent. Urgency scoring and EDF check-in plans for group leaders
      Handler: handlers/agents.coordinator
      Timeout: 120
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref GroupsTable }
        - DynamoDBReadPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
      Events:
        ThreeHourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(15 0/3 * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  WatchdogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Otto - Ops Watchdog agent. Probes the public URL, EWMA latency control charts, heartbeats, incidents
      Handler: handlers/agents.watchdog
      Timeout: 90
      Environment:
        Variables:
          SITE_URL: !Sub https://${Distribution.DomainName}
          OPS_TOPIC_ARN: !Ref OpsTopic
          PUBLIC_API_FUNCTION: !Ref PublicApiFunction
          ENROLLMENT_API_FUNCTION: !Ref EnrollmentApiFunction
          ALERT_CHECK_FUNCTION: !Ref AlertCheckFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt OpsTopic.TopicName }
        - !Ref BedrockInvokePolicy
        - Statement:
            - Sid: ReadOwnFunctionLogs
              Effect: Allow
              Action: logs:FilterLogEvents
              Resource:
                - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${PublicApiFunction}:*
                - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnrollmentApiFunction}:*
                - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AlertCheckFunction}:*
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/15 * * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  SentinelLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SentinelFunction}
      RetentionInDays: 14
  CoordinatorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CoordinatorFunction}
      RetentionInDays: 14
  WatchdogLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WatchdogFunction}
      RetentionInDays: 14

  # ------------------------------------------------------------------ frontend
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: # private: only CloudFront (via OAC) can read it
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOriginAccessControl
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HeatShield - frontend (S3) + API (/api/* -> HTTP API) on one HTTPS origin
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All # users are worldwide (Karachi, Lagos, Dubai...) - serve from every edge
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

Outputs:
  SiteUrl:
    Description: Public HTTPS URL (frontend + API)
    Value: !Sub https://${Distribution.DomainName}
  ApiDirectUrl:
    Description: HTTP API endpoint (the site calls it via CloudFront at /api/*)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  AlertCheckFunctionName:
    Value: !Ref AlertCheckFunction
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  LocationsTableName:
    Value: !Ref LocationsTable
  GroupsTableName:
    Value: !Ref GroupsTable
  SentinelFunctionName:
    Value: !Ref SentinelFunction
  CoordinatorFunctionName:
    Value: !Ref CoordinatorFunction
  WatchdogFunctionName:
    Value: !Ref WatchdogFunction
  AgentLogTableName:
    Value: !Ref AgentLogTable
  OpsTopicArn:
    Value: !Ref OpsTopic
