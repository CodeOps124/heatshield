AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  HeatShield - multilingual heat-risk early warning. S3 + CloudFront frontend, HTTP API + Lambda
  backend, DynamoDB, Amazon Bedrock guidance, EventBridge Scheduler + SNS alerts. Fully serverless:
  near-zero idle cost, nothing to patch.

Parameters:
  BedrockModelId:
    Type: String
    Description: Primary Bedrock model or inference-profile ID for guidance generation.
  BedrockFallbackModelId:
    Type: String
    Default: ''
    Description: Optional second model tried when the primary fails (for example an Amazon Nova profile).
  BedrockFoundationModelArnPattern:
    Type: String
    Default: 'anthropic.claude-haiku-4-5*'
    Description: Foundation-model name pattern the primary inference profile routes to (IAM scoping).
  BedrockFallbackFoundationModelArnPattern:
    Type: String
    Default: 'amazon.nova-*'
    Description: Foundation-model name pattern for the fallback model (IAM scoping).
  AgentModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Model for the tool-using agents (Sol, Kai, Otto).
  AgentFoundationModelArnPattern:
    Type: String
    Default: 'amazon.nova-2-lite*'
  ReviewerModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
    Description: Model for the reviewers (Lexi, Vera) - a different model family from the writer.
  AskModelId:
    Type: String
    Default: moonshotai.kimi-k2.5
    Description: Model that coordinates Ask the team (measured best of five on tool use and grounding, 30 Sep 2026); Nova Pro is its fallback.
  ReviewerFoundationModelArnPattern:
    Type: String
    Default: 'amazon.nova-pro*'
  AppVersion:
    Type: String
    Default: dev
  AlertScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: ENABLED
  SiteDomain:
    Type: String
    Default: ''
    Description: >-
      The CloudFront domain of this stack (set automatically by scripts/deploy.mjs after the first
      deploy). Passed in rather than referenced so the admin sign-in and the agents can use it
      without a CloudFormation dependency cycle.
  AdminAuthDomainPrefix:
    Type: String
    Default: heatshield-ops-k3v9x
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Prefix of the Amazon Cognito sign-in domain for the admin console (must be unique in the region).

Conditions:
  HasFallbackModel: !Not [!Equals [!Ref BedrockFallbackModelId, '']]
  HasSiteDomain: !Not [!Equals [!Ref SiteDomain, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    CodeUri: functions/
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        APP_VERSION: !Ref AppVersion
        GROUPS_TABLE: !Ref GroupsTable
        LOCATIONS_TABLE: !Ref LocationsTable
        ALERTS_TABLE: !Ref AlertsTable
        GUIDANCE_CACHE_TABLE: !Ref GuidanceCacheTable
        ALERTS_TOPIC_ARN: !Ref AlertsTopic
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
        AGENT_MODEL_ID: !Ref AgentModelId
        REVIEWER_MODEL_ID: !Ref ReviewerModelId
        ASK_MODEL_ID: !Ref AskModelId
        AGENT_LOG_TABLE: !Ref AgentLogTable

Resources:
  # ------------------------------------------------------------------ agents: shared model access
  # One managed policy, scoped to exactly the inference profiles (and the foundation models they
  # route to) that HeatShield uses. Attached to every function that calls Bedrock.
  BedrockInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: HeatShield - invoke only the Bedrock models the agents use
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeHeatShieldModels
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${AgentModelId}
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ReviewerModelId}
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelArnPattern}
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${AgentFoundationModelArnPattern}
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${ReviewerFoundationModelArnPattern}
              - !If
                - HasFallbackModel
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockFallbackModelId}
                - !Ref AWS::NoValue
              - !If
                - HasFallbackModel
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFallbackFoundationModelArnPattern}
                - !Ref AWS::NoValue
              - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${AskModelId} # on-demand, no inference profile

  AgentLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: HeatShield Ops # Otto's incident reports and the CloudWatch alarms; subscribe an on-call email

  # Scheduled runs that fail twice (one retry) land here; Otto reports the count, the admin console lists them.
  FailedRunsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  # ------------------------------------------------------------------ admin sign-in (Amazon Cognito)
  # Operators only: nobody can sign up; an administrator account is created with an email invite.
  # Public app client (no secret), authorization code + PKCE; API Gateway checks the JWT.
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-admins
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your HeatShield admin account
          EmailMessage: 'You have been added as a HeatShield administrator. Open the admin console, sign in as {username} with the temporary password {####}, and choose your own password.'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      MfaConfiguration: 'OFF'

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AdminAuthDomainPrefix
      UserPoolId: !Ref AdminUserPool
      ManagedLoginVersion: 1 # classic hosted sign-in page (no branding resource needed)

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: admin-console
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!If [HasSiteDomain, !Sub 'https://${SiteDomain}/admin.html', 'http://localhost:8787/admin.html']]
      LogoutURLs: [!If [HasSiteDomain, !Sub 'https://${SiteDomain}/admin.html', 'http://localhost:8787/admin.html']]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: minutes }

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref AdminUserPool
      Description: HeatShield operators (admin console)

  # ------------------------------------------------------------------ data
  GroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: groupId, AttributeType: S }
      KeySchema:
        - { AttributeName: groupId, KeyType: HASH }

  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: locationId, AttributeType: S }
        - { AttributeName: groupId, AttributeType: S }
      KeySchema:
        - { AttributeName: locationId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: byGroup # sparse: only locations enrolled in a group carry groupId
          KeySchema:
            - { AttributeName: groupId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: locationId, AttributeType: S }
        - { AttributeName: alertDate, AttributeType: S }
      KeySchema:
        - { AttributeName: locationId, KeyType: HASH }
        - { AttributeName: alertDate, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  GuidanceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: cacheKey, AttributeType: S }
      KeySchema:
        - { AttributeName: cacheKey, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  # ------------------------------------------------------------------ alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: HeatShield # shown as the sender name on alert emails

  # ------------------------------------------------------------------ API
  HttpApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          AdminJwt: # only the admin routes use it; public routes stay anonymous
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}
              audience: [!Ref AdminUserPoolClient]
      DefaultRouteSettings: # per-route throttle: caps abuse (and Bedrock spend) on a public endpoint
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        # Registrations can trigger an AWS confirmation email to any address typed in, so these
        # routes are throttled hard to stop HeatShield being used to spam inboxes.
        # (Production: add an AWS WAF per-IP rate-based rule on CloudFront.)
        POST /api/locations:
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        POST /api/groups:
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        POST /api/groups/{groupId}/plan: # runs Kai (Bedrock); also a per-group 10-minute cooldown in code
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
        POST /api/agents/{agentId}/run: # runs Sol or Otto; also a global per-agent cooldown in code
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
        POST /api/ask: # Ask the team (Bedrock, up to 24 s); also at most 30 questions per 10 minutes in code
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  PublicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Public API - health, geocoding, heat risk, guidance (Mira writes, Lexi and Vera review), plans read aloud (Amazon Polly), Ask the team, agents feed
      Handler: handlers/public-api.handler
      Timeout: 28
      Environment:
        Variables:
          SENTINEL_FUNCTION: !Ref SentinelFunction
          WATCHDOG_FUNCTION: !Ref WatchdogFunction
          SITE_BUCKET: !Ref SiteBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GuidanceCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
        - LambdaInvokePolicy: { FunctionName: !Ref SentinelFunction } # visitor "ask Sol to rescan"
        - LambdaInvokePolicy: { FunctionName: !Ref WatchdogFunction } # visitor "ask Otto to check"
        - Statement:
            - Sid: ReadPlansAloud
              Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*' # Polly has no resource type for SynthesizeSpeech without a lexicon
            - Sid: StoreAudio
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub '${SiteBucket.Arn}/audio/*'
            - Sid: TellMissingAudioFromDenied
              Effect: Allow
              Action: s3:ListBucket # without it, S3 answers 403 instead of 404 for a file not made yet
              Resource: !GetAtt SiteBucket.Arn
      Events:
        Agents: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/agents } }
        Notice: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/notice } }
        RunAgent: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/agents/{agentId}/run' } }
        Health: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/health } }
        Geocode: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/geocode } }
        Risk: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/risk } }
        Guidance: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/guidance } }
        Speech: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/speech } }
        Ask: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/ask } }

  EnrollmentApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Groups, registrations, community-leader dashboard (with Kai's check-in plan), self-service deletion
      Handler: handlers/enrollment-api.handler
      Timeout: 28
      Environment:
        Variables:
          COORDINATOR_FUNCTION: !Ref CoordinatorFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GroupsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable } # read plans; delete a deleted group's plan
        - LambdaInvokePolicy: { FunctionName: !Ref CoordinatorFunction }
        - Statement:
            - Sid: SubscribeEmailToAlerts
              Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertsTopic
            - Sid: ManageOwnSubscriptions
              Effect: Allow
              Action: [sns:Unsubscribe, sns:GetSubscriptionAttributes]
              # SNS authorizes these against the TOPIC ARN, not the subscription ARN (verified in
              # CloudTrail: "not authorized to perform: SNS:GetSubscriptionAttributes on resource:
              # arn:aws:sns:...:heatshield-AlertsTopic-..."). Both forms are listed.
              Resource: [!Ref AlertsTopic, !Sub '${AlertsTopic}:*']
      Events:
        CreateGroup: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/groups } }
        GetGroup: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/groups/{groupId}' } }
        Dashboard: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/groups/{groupId}/dashboard' } }
        RemoveMember: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/groups/{groupId}/members/{locationId}' } }
        Register: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/locations } }
        GetLocation: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/locations/{locationId}' } }
        DeleteLocation: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/locations/{locationId}' } }
        RequestPlan: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/groups/{groupId}/plan' } }
        DeleteGroup: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/groups/{groupId}' } }

  AdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Admin console API (Amazon Cognito sign-in) - pauses, AI budget, site notice, run agents, recall plans, audit
      Handler: handlers/admin-api.handler
      Timeout: 28
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          FAILED_RUNS_QUEUE_URL: !Ref FailedRunsQueue
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GuidanceCacheTable } # recall a cached plan
        - Statement:
            - Sid: FindStackFunctions
              Effect: Allow
              Action: logs:DescribeLogGroups
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
            - Sid: RunAgents # matched by this stack's name prefix (no template references: no cycle)
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*
            - Sid: FailedRuns
              Effect: Allow
              Action: [sqs:GetQueueAttributes, sqs:ReceiveMessage, sqs:PurgeQueue]
              Resource: !GetAtt FailedRunsQueue.Arn
            - Sid: AlarmStates
              Effect: Allow
              Action: cloudwatch:DescribeAlarms
              Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*
      Events:
        Overview: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/admin/overview, Auth: { Authorizer: AdminJwt } } }
        Settings: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: /api/admin/settings, Auth: { Authorizer: AdminJwt } } }
        RunAgent: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/admin/agents/{agentId}/run', Auth: { Authorizer: AdminJwt } } }
        Plans: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/admin/plans, Auth: { Authorizer: AdminJwt } } }
        RecallPlan: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/api/admin/plans/{cacheKey}', Auth: { Authorizer: AdminJwt } } }
        FailedRuns: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/admin/failed-runs, Auth: { Authorizer: AdminJwt } } }
        ClearFailedRuns: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: /api/admin/failed-runs, Auth: { Authorizer: AdminJwt } } }

  AdminApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AdminApiFunction}
      RetentionInDays: 14

  AlertCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Hourly - recompute risk for every registered location and send SNS alerts on threshold crossing
      Handler: handlers/alert-check.handler
      Timeout: 300
      EventInvokeConfig: # retry once, then the dead-letter queue
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt FailedRunsQueue.Arn }
      Environment:
        Variables:
          SITE_URL: !Sub https://${Distribution.DomainName}
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GuidanceCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - !Ref BedrockInvokePolicy
        - SQSSendMessagePolicy: { QueueName: !GetAtt FailedRunsQueue.QueueName }
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 * * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 } # next hour's run is the retry

  # Explicit log groups so logs expire (cost hygiene) instead of being kept forever.
  PublicApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PublicApiFunction}
      RetentionInDays: 14
  EnrollmentApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EnrollmentApiFunction}
      RetentionInDays: 14
  AlertCheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AlertCheckFunction}
      RetentionInDays: 14

  # ------------------------------------------------------------------ scheduled AI agents
  SentinelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Sol - Heat Sentinel agent. Excess Heat Factor vs local climate, heat watches and briefing
      Handler: handlers/agents.sentinel
      Timeout: 300
      EventInvokeConfig: # retry once, then the dead-letter queue
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt FailedRunsQueue.Arn }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
        - SQSSendMessagePolicy: { QueueName: !GetAtt FailedRunsQueue.QueueName }
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 * * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  CoordinatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Kai - Community Coordinator agent. Urgency scoring and EDF check-in plans for group leaders
      Handler: handlers/agents.coordinator
      Timeout: 120
      EventInvokeConfig: # retry once, then the dead-letter queue
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt FailedRunsQueue.Arn }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref GroupsTable }
        - DynamoDBReadPolicy: { TableName: !Ref LocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
        - SQSSendMessagePolicy: { QueueName: !GetAtt FailedRunsQueue.QueueName }
      Events:
        ThreeHourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(15 0/3 * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  WatchdogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Otto - Ops Watchdog agent. Probes the public URL, EWMA latency control charts, heartbeats, incidents
      Handler: handlers/agents.watchdog
      Timeout: 90
      EventInvokeConfig: # retry once, then the dead-letter queue
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt FailedRunsQueue.Arn }
      # No references to the functions Otto watches (or to the distribution): the public API can
      # invoke Otto on demand, so a reference back would be a CloudFormation dependency cycle.
      # Log groups are discovered by the stack-name prefix; the site URL arrives in the schedule input.
      Environment:
        Variables:
          OPS_TOPIC_ARN: !Ref OpsTopic
          STACK_NAME: !Ref AWS::StackName
          FAILED_RUNS_QUEUE_URL: !Ref FailedRunsQueue
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt OpsTopic.TopicName }
        - !Ref BedrockInvokePolicy
        - SQSSendMessagePolicy: { QueueName: !GetAtt FailedRunsQueue.QueueName }
        - Statement:
            - Sid: CountFailedRuns
              Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource: !GetAtt FailedRunsQueue.Arn
            - Sid: RerunStalledAgents # self-healing; functions are matched by this stack's name prefix
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*
        - Statement:
            - Sid: FindStackLogGroups
              Effect: Allow
              Action: logs:DescribeLogGroups
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
            - Sid: ReadStackFunctionLogs
              Effect: Allow
              Action: logs:FilterLogEvents
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/15 * * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }
            Input: !Sub '{"siteUrl":"https://${Distribution.DomainName}"}'

  AuditorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Quinn - Forecast Auditor agent. Verifies recent heat forecasts per city against the model analysis
      Handler: handlers/agents.auditor
      Timeout: 120
      EventInvokeConfig: # retry once, then the dead-letter queue
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt FailedRunsQueue.Arn }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
        - SQSSendMessagePolicy: { QueueName: !GetAtt FailedRunsQueue.QueueName }
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 1 * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  CoachFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Iris - Learning Coach agent. Turns the language reviewer corrections into word lists for the writer
      Handler: handlers/agents.coach
      Timeout: 180
      EventInvokeConfig: # retry once, then the dead-letter queue
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt FailedRunsQueue.Arn }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AgentLogTable }
        - !Ref BedrockInvokePolicy
        - SQSSendMessagePolicy: { QueueName: !GetAtt FailedRunsQueue.QueueName }
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 2 * * ? *)
            State: !Ref AlertScheduleState
            RetryPolicy: { MaximumRetryAttempts: 0 }

  AuditorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AuditorFunction}
      RetentionInDays: 14
  CoachLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CoachFunction}
      RetentionInDays: 14

  SentinelLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SentinelFunction}
      RetentionInDays: 14
  CoordinatorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CoordinatorFunction}
      RetentionInDays: 14
  WatchdogLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WatchdogFunction}
      RetentionInDays: 14

  # ------------------------------------------------------------------ alarms (email the ops topic)
  # Inside the CloudWatch free tier (10 alarms). OK actions too, so a recovery is emailed as well.
  PublicApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-public-api-errors
      AlarmDescription: 'The public API function crashed or timed out.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref PublicApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  EnrollmentApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-enrollment-api-errors
      AlarmDescription: 'The enrollment API function crashed or timed out.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref EnrollmentApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  DispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dispatcher-errors
      AlarmDescription: 'The hourly alert Dispatcher crashed or timed out; heat alerts may not have gone out.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AlertCheckFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: 'The HTTP API returned 10 or more server errors in 5 minutes.'
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  WatchdogSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-otto-silent
      AlarmDescription: 'Otto, the watchdog, has not run for 30 minutes: nobody is watching the site.'
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref WatchdogFunction }]
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  DispatcherSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dispatcher-silent
      AlarmDescription: 'The hourly alert Dispatcher has not run for 2 hours: heat alerts are not being checked.'
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref AlertCheckFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  FailedRunsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-failed-runs
      AlarmDescription: 'A scheduled agent run failed twice and is waiting in the dead-letter queue.'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailedRunsQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]
  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-lambda-throttles
      AlarmDescription: 'A Lambda function in this account was throttled (concurrency limit).'
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]

  AdminApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-admin-api-errors
      AlarmDescription: 'The admin console API function crashed or timed out.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AdminApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]

  # ------------------------------------------------------------------ frontend
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: # private: only CloudFront (via OAC) can read it
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-plan-audio # plans change every few hours; a file no one asks for again is not kept
            Status: Enabled
            Prefix: audio/
            ExpirationInDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOriginAccessControl
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            # connect-src also allows the Cognito token endpoint (the admin page's sign-in code exchange).
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://${AdminAuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HeatShield - frontend (S3) + API (/api/* -> HTTP API) on one HTTPS origin
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All # users are worldwide (Karachi, Lagos, Dubai...) - serve from every edge
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

Outputs:
  SiteUrl:
    Description: Public HTTPS URL (frontend + API)
    Value: !Sub https://${Distribution.DomainName}
  ApiDirectUrl:
    Description: HTTP API endpoint (the site calls it via CloudFront at /api/*)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  AlertCheckFunctionName:
    Value: !Ref AlertCheckFunction
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  LocationsTableName:
    Value: !Ref LocationsTable
  GroupsTableName:
    Value: !Ref GroupsTable
  SentinelFunctionName:
    Value: !Ref SentinelFunction
  CoordinatorFunctionName:
    Value: !Ref CoordinatorFunction
  WatchdogFunctionName:
    Value: !Ref WatchdogFunction
  AgentLogTableName:
    Value: !Ref AgentLogTable
  OpsTopicArn:
    Value: !Ref OpsTopic
  FailedRunsQueueUrl:
    Value: !Ref FailedRunsQueue
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminClientId:
    Value: !Ref AdminUserPoolClient
  AdminAuthDomain:
    Value: !Sub ${AdminAuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
